<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Kemer Yat Turu — lüks tekne turu logosu">
  <title>Kemer Yat Turu</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c3d70"/>
      <stop offset="1" stop-color="#062b45"/>
    </linearGradient>
    <linearGradient id="sail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcbb79"/>
      <stop offset="1" stop-color="#c8a25a"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8ff"/>
      <stop offset="1" stop-color="#33a1f6"/>
    </linearGradient>
  </defs>

  <!-- Arka plan -->
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <circle cx="384" cy="128" r="46" fill="#59c0ff" opacity="0.28"/>

  <!-- Direk -->
  <rect x="246" y="92" width="16" height="228" rx="8" fill="#eef9ff" opacity="0.55"/>

  <!-- Yelken -->
  <path d="M256 88l130 212H126z" fill="url(#sail)"/>
  <!-- İkinci küçük yelken -->
  <path d="M238 140l-92 160h92z" fill="#dcbb79" opacity="0.75"/>

  <!-- Tekne gövdesi -->
  <path d="M96 336h320l-34 66H130z" fill="url(#hull)"/>

  <!-- Dalga çizgileri -->
  <path d="M64 424c40-18 82-18 122 0s82 18 122 0 82-18 122 0" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" opacity="0.75"/>
  <path d="M96 466c34-14 68-14 102 0s68 14 102 0 68-14 102 0" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" opacity="0.4"/>
</svg>
